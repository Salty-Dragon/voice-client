name: Test Windows app

# Installs the app from its installer on a clean Windows machine and uses it
# the way a player would: sign-in link, first-run wizard, push-to-talk while
# another window has focus, a second player talking, the roster board, closing
# and reopening. The app talks to a private copy of the backend started on the
# same machine, so the live server is never involved.
#
# Runs after every build (called from build.yml), or by hand against a release.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
      run_id:
        type: string
        default: ""
      backend_ref:
        type: string
        default: main
    secrets:
      BACKEND_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to test, for example v0.5.1"
        type: string
        default: ""
      run_id:
        description: "Or: a build run whose installer to test"
        type: string
        default: ""
      backend_ref:
        description: "Backend branch or commit"
        type: string
        default: main

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: client
          ref: ${{ inputs.tag || github.sha }}
      # The backend is private; this key can only read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Warcryer/server
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          ref: ${{ inputs.backend_ref }}
          path: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Installer from this build
        if: inputs.tag == '' && inputs.run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: installer
      # The same build numbered 0.0.1, which the update test upgrades from.
      - name: Old-numbered copy from this build
        if: inputs.tag == '' && inputs.run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: update-base
          path: update-base
      - name: Installer from an earlier build
        if: inputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n installer -D installer
          # Kept for three days only; without it the update checks are skipped.
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n update-base -D update-base || true
      - name: Installer from a release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "*.exe" -p "*.exe.sig" -D installer
      - name: Install and test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer -Filter *.exe | Select-Object -First 1).FullName
          $base = ""
          if (Test-Path update-base) { $base = (Get-ChildItem update-base -Filter *.exe | Select-Object -First 1).FullName }
          ./backend/e2e/desktop/ci.ps1 -Installer $installer -Client "$PWD\client" -UpdateBase "$base"
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test
          path: |
            C:/vt/run/shots
            C:/vt/run/stack/logs
          if-no-files-found: ignore
