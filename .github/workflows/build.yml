name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**", ".github/workflows/site.yml"]   # the project page has its own workflow
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest   # GitHub-hosted runner, as SignPath requires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Installs that installer on a clean Windows machine and uses the app.
  test:
    needs: build
    uses: ./.github/workflows/test-windows.yml
    secrets: inherit

  # A tagged build is published only if the installed app passed its test.
  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.exe -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --prerelease \
            --notes "Unsigned test build. Windows SmartScreen will warn: choose More info, then Run anyway. This build passed the automated test of the installed app on Windows."
